<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baixar PDF</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .botao-download {
      padding: 15px 30px;
      background-color: #1f4e79;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.3s;
    }

    .botao-download:hover {
      background-color: #163a5a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <a 
    class="botao-download" 
    href="./TrustScore_Modelo_Negocio.pdf" 
    download
  >
    Baixar PDF
  </a>

</body>
</html>
